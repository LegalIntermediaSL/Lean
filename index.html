<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lean 4: Cálculo Lambda y Teoría de Tipos Dependientes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Enciclopedia interactiva, Mini-Curso de Teoría de Tipos Dependientes, 70 módulos ejecutables y 5 talleres de Lean 4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  <style>
    :root {
      --theme-color: #38bdf8;
      --sidebar-width: 295px;
    }
    .lean-playground-btn {
      display: inline-block;
      margin: 6px 8px 14px 0;
      padding: 6px 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff !important;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .lean-playground-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }
    .lean-playground-btn.secondary {
      background: linear-gradient(135deg, #334155, #475569);
    }
    .lean-viewer-banner {
      padding: 14px 18px;
      margin-bottom: 16px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="app">Cargando portal interactivo de Lean 4...</div>
  <script>
    window.$docsify = {
      name: 'Lean 4 & Tipos Dependientes',
      repo: 'https://github.com/LegalIntermediaSL/Lean',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar teoremas, tácticas, tipos Π/Σ, módulos M01-M70...',
        noData: 'Sin resultados',
        depth: 4
      },
      plugins: [
        function(hook, vm) {
          // 1. Interceptar clics en enlaces a archivos `.lean` para abrirlos en el visor integrado
          document.addEventListener('click', function(e) {
            var link = e.target.closest('a');
            if (!link) return;
            var href = link.getAttribute('href') || '';
            if (href.indexOf('.lean') !== -1 && href.indexOf('http') !== 0) {
              e.preventDefault();
              var cleanPath = href.replace(/^#\/?/, '').replace(/^\.\.\//, '').replace(/^\.\//, '');
              if (cleanPath.indexOf('LeanTT/') !== 0 && cleanPath !== 'LeanTT.lean' && cleanPath !== 'Main.lean') {
                var idx = cleanPath.indexOf('LeanTT/');
                if (idx !== -1) cleanPath = cleanPath.substring(idx);
              }
              window.location.hash = '#/view-lean?file=' + encodeURIComponent(cleanPath);
            }
          });

          // 2. Renderizar el visor interactivo cuando la ruta es `#/view-lean?file=...`
          hook.afterEach(function(html, next) {
            if (vm.route.path === '/view-lean' && vm.route.query && vm.route.query.file) {
              var filePath = vm.route.query.file;
              fetch(filePath)
                .then(function(res) {
                  if (!res.ok) throw new Error('No se pudo cargar ' + filePath);
                  return res.text();
                })
                .then(function(code) {
                  var escaped = code
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                  var playUrl = 'https://live.lean-lang.org/#code=' + encodeURIComponent(code);
                  var ghUrl = 'https://github.com/LegalIntermediaSL/Lean/blob/main/' + filePath;
                  var viewerHtml =
                    '<div class="lean-viewer-banner">' +
                      '<h2 style="margin-top:0">📄 Módulo Ejecutable Lean 4: <code>' + filePath + '</code></h2>' +
                      '<p>Verificado formalmente por el Kernel de Lean 4 (<code>0 sorry</code>).</p>' +
                      '<a class="lean-playground-btn" href="' + playUrl + '" target="_blank" rel="noopener noreferrer">' +
                        '▶ Abrir módulo completo en Lean 4 Web Playground (live.lean-lang.org)' +
                      '</a>' +
                      '<a class="lean-playground-btn secondary" href="' + ghUrl + '" target="_blank" rel="noopener noreferrer">' +
                        '🔗 Ver archivo en GitHub' +
                      '</a>' +
                      '<a class="lean-playground-btn secondary" href="#/">' +
                        '⬅ Volver al Índice' +
                      '</a>' +
                    '</div>' +
                    '<pre data-lang="lean"><code class="lang-lean">' + escaped + '</code></pre>';
                  next(viewerHtml);
                })
                .catch(function(err) {
                  next('<p>Error al cargar el archivo Lean: <code>' + err.message + '</code></p>');
                });
            } else {
              next(html);
            }
          });

          // 3. Añadir botón "Ejecutar en Lean 4 Web Playground" a cada bloque de código Lean en las guías
          hook.doneEach(function() {
            var blocks = document.querySelectorAll('pre[data-lang="lean"] code');
            blocks.forEach(function(codeEl) {
              var pre = codeEl.parentElement;
              if (pre && !pre.nextElementSibling?.classList?.contains('lean-playground-btn')) {
                var rawCode = codeEl.innerText || codeEl.textContent;
                var url = 'https://live.lean-lang.org/#code=' + encodeURIComponent(rawCode);
                var btn = document.createElement('a');
                btn.href = url;
                btn.target = '_blank';
                btn.rel = 'noopener noreferrer';
                btn.className = 'lean-playground-btn';
                btn.innerText = '▶ Ejecutar este código en Lean 4 Web Playground (live.lean-lang.org)';
                pre.insertAdjacentElement('afterend', btn);
              }
            });
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lean.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: "dark" });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
