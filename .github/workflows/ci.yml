name: Lean 4 Kernel Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Verify all 70 LeanTT Modules, 5 Workshops & CLI Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install elan and Lean 4 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build and verify all 70 LeanTT modules, 5 workshops and CLI with Lake
        run: |
          lake update
          lake build
          lake exe leantt
      - name: Verify all Markdown internal links and executable Lean 4 Playground snippets
        run: |
          python3 scripts/check_doc_snippets.py
