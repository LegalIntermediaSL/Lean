name: Deploy Interactive Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site directory (_site)
        run: |
          mkdir -p _site
          cp index.html README.md _sidebar.md .nojekyll LICENSE LeanTT.lean Main.lean _site/
          cp -r docs LeanTT _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Wait for artifact indexing propagation
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
